name: Build

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        run: python build.py
      - name: Build the TestKit
        run: python build_testkit.py
      - uses: actions/upload-artifact@v7
        with:
          path: build/CodeBleu-LooseEnds.ts4script
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: build/CodeBleu-LooseEnds-TestKit.ts4script
          archive: false
          if-no-files-found: error
      - name: Attach the mod to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          curl --fail --silent --show-error -X POST
          -H "Authorization: Bearer $GH_TOKEN"
          -H "Accept: application/vnd.github+json"
          -H "Content-Type: application/octet-stream"
          --data-binary @build/CodeBleu-LooseEnds.ts4script
          "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=CodeBleu-LooseEnds.ts4script"