name: Build

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.7
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        run: python build.py
      - name: Build the TestKit
        run: python build_testkit.py
      - uses: actions/upload-artifact@v7
        with:
          path: build/CodeBleu-LooseEnds.ts4script
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: build/CodeBleu-LooseEnds-TestKit.ts4script
          archive: false
          if-no-files-found: error